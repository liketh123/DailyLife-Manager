apiVersion: apps/v1
kind: Deployment
metadata:
  name: dailylife-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dailylife-manager
  template:
    metadata:
      labels:
        app: dailylife-manager
    spec:
      containers:
      - name: dailylife-manager
        image: dailylife-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
