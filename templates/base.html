<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}DailyLife Manager{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>
<nav class="navbar"><a class="brand" href="{{ url_for('dashboard') }}">DailyLife Manager</a>
<div class="navlinks"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('tasks') }}">Tasks</a><a href="{{ url_for('schedule') }}">Schedule</a><a href="{{ url_for('expenses') }}">Expenses</a><a href="{{ url_for('goals') }}">Goals</a></div></nav>
<main class="page">
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer>DailyLife Manager • DevOps Project</footer>
<script src="{{ url_for('static',filename='script.js') }}"></script></body></html>
