{% extends "base.html" %}{% block title %}Tasks | DailyLife Manager{% endblock %}{% block content %}
<div class="page-title"><h1>📝 Tasks</h1><p>Create, complete and delete tasks.</p></div><section class="panel form-panel"><form method="post" class="form-grid"><input name="title" placeholder="Task name" required><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><input type="date" name="due_date" value="{{request.args.get('date','')}}"><button class="button">Add Task</button></form></section>
<section class="panel">{% for task in tasks %}<div class="list-row {% if task.completed %}done{% endif %}><form method="post" action="{{url_for('toggle_task',task_id=task.id)}}"><button class="check">{{"✓" if task.completed else "○"}}</button></form><div class="row-main"><strong>{{task.title}}</strong><span>{{task.due_date}} • {{task.priority}}</span></div><form method="post" action="{{url_for('delete_task',task_id=task.id)}}" onsubmit="return confirmDelete('task')"><button class="danger-link">Delete</button></form></div>{% else %}<p class="muted">No tasks yet.</p>{% endfor %}</section>{% endblock %}
